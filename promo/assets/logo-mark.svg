<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="%J,'1J">
  <!-- Ejari mark: deep green field + gold % / key-home motif -->
  <rect width="64" height="64" rx="10" fill="#0F3A30"/>
  <!-- subtle gold base rail -->
  <rect x="0" y="54" width="64" height="10" fill="#B58D3D"/>
  <!-- home roof -->
  <path d="M14 30 L32 16 L50 30" fill="none" stroke="#C9A45A" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- key shaft + bit (home doorway metaphor) -->
  <rect x="29.2" y="28" width="5.6" height="18" rx="1.2" fill="#C9A45A"/>
  <path d="M29.2 42 h5.6 v4.5 c0 1.4-1.1 2.5-2.5 2.5 h-.6 c-1.4 0-2.5-1.1-2.5-2.5 z" fill="#C9A45A"/>
  <!-- key bow as stylized % ring -->
  <circle cx="32" cy="24.5" r="7.2" fill="none" stroke="#C9A45A" stroke-width="3.1"/>
  <circle cx="32" cy="24.5" r="2.4" fill="#0F3A30"/>
  <!-- gold accent on roof peak -->
  <circle cx="32" cy="16" r="2.2" fill="#B58D3D"/>
</svg>
